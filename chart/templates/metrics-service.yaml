apiVersion: v1
kind: Service
metadata:
  name: {{ include "proxy.fullname" . }}-metrics
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
    {{- with .Values.metricsService.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- toYaml .Values.metricsService.annotations | nindent 4 }}
spec:
  type: {{ .Values.metricsService.type }}
  ports:
    - port: {{ .Values.metricsService.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "proxy.selectorLabels" . | nindent 4 }}
